<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<!-- KAIZO KNIGHT — a recreation of EnderCat8's Kaizo Roaring Knight mod.
     NOT the real fight.
     This page is kaizo-owned (kaizo/HANDOFF.md §2): it imports from kaizo/
     and is the ONLY thing under web/ allowed to. The main page's code paths
     are untouched by its existence; deleting kaizo/ and this page leaves the
     main sim exactly as it was.

     SEPARATE REPO SINCE 2026-09-02 (kaizo-knight-sim). This page is the ONLY page
     here; the vanilla title lives in knight-sim. It registers ITS OWN service
     worker (web/sw.js, cache prefix kaizoknight-) and its own manifest, so an
     install of this game and an install of the real one never share a cache
     even on one origin.

     EVERYTHING BELOW THE NAMES IS knight-sim's web/index.html, VERBATIM
     (4aa2b63, 2026-09-08): the same shell, the same touch overlay, the same
     CSS with the same comments, so the two builds feel like one product. When
     knight-sim's page moves, diff the two and re-copy — vendoring never
     touches web/. -->
<!-- iOS reads these instead of (most of) the manifest: standalone display and
     the home-screen icon. black-translucent lets the game draw under the
     status bar, which the safe-area insets in the CSS already account for. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KaizoKnight">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Kaizo Knight Simulator</title>
<style>
  /* THE GAME FILLS THE WINDOW, and nothing else is on screen.
     The page used to be a canvas with a debug readout under it (frame
     counter, HP, sprite count, key legend) and the canvas sized to leave
     room for that line. It read as a harness with a game inside it; the
     real thing is 640x480 letterboxed into whatever it is given. */
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: #ccc;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    /* MOBILE: the page is a game, not a document. No scroll, no pinch zoom,
       no rubber-banding, no long-press callout — every one of those gestures
       is a dodge input the browser would otherwise steal. */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  /* The letterbox: centre the canvas in the viewport and let the aspect
     ratio decide which pair of bars appears. `min()` on both axes is what
     keeps the WHOLE frame on screen — sizing on width alone once made the
     canvas taller than the window and cropped the top ~65 rows, which is
     exactly where the Stars cone opens and where the Knight stands.

     THIS IS THE PRE-SCRIPT FALLBACK ONLY. `fitCanvas()` in kaizo.js
     (main.js's, verbatim) overrides both axes with an INTEGER-multiple size,
     because `image-rendering: pixelated` at a fractional scale is what
     produced the reported "weird" menu text: nearest-neighbour with a
     4.725x factor gives some source pixels 4 device pixels and others 5, so
     a 1px font stem is thick on one letter and thin on the next. There is
     no filtering that fixes that — only landing on a whole number. */
  #game {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 4 / 3));
    height: min(100vh, calc(100vw * 3 / 4));
    background: #000;
    /* Nearest-neighbour, like every other surface in this project. */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
  /* ATTRIBUTION. Small, dim, and at the very bottom of the window rather than
     inside the 640x480 frame -- the frame is the game's own art and nothing
     of ours belongs on it. `pointer-events: none` so it can never eat a click
     meant for the canvas, and it steps up out of the way when the debug HUD
     is showing, since both live on the bottom edge. */
  /* ---- TOUCH CONTROLS ------------------------------------------------
     Hidden on fine-pointer machines; shown wherever the primary pointer is
     coarse. The container ignores pointers so the play area stays clean —
     only the pad and buttons themselves are targets. Positions respect the
     notch/home-bar insets. */
  #touch { display: none; }
  @media (pointer: coarse) {
    #touch {
      display: block;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
  }
  #touch .pad, #touch .btn {
    position: absolute;
    pointer-events: auto;
    touch-action: none;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.06);
    /* Belt and braces ON the elements, not only inherited from body: a held
       X was long-press-selecting its own label ("it selects x if you hold
       it and it's kinda distracting" — reported from a phone). The
       tap-highlight flash goes for the same reason. */
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #dpad {
    left: max(18px, env(safe-area-inset-left));
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 148px;
    height: 148px;
  }
  /* The pad's cross, drawn with gradients so there is no asset to load. */
  #dpad::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(255,255,255,0.14), rgba(255,255,255,0.14)) 50% 0 / 34% 100% no-repeat,
      linear-gradient(rgba(255,255,255,0.14), rgba(255,255,255,0.14)) 0 50% / 100% 34% no-repeat;
    border-radius: inherit;
  }
  #touch .btn {
    width: 64px;
    height: 64px;
    color: rgba(255, 255, 255, 0.55);
    font: bold 20px/60px ui-monospace, Menlo, monospace;
    text-align: center;
  }
  #touch .btn.down { background: rgba(255, 255, 255, 0.22); }
  #btnZ {
    right: max(20px, env(safe-area-inset-right));
    bottom: calc(max(18px, env(safe-area-inset-bottom)) + 74px);
  }
  #btnX {
    right: calc(max(20px, env(safe-area-inset-right)) + 74px);
    bottom: max(18px, env(safe-area-inset-bottom));
  }
  /* TOUCH BUTTONS — the GRAPHICS toggle (sim/modes.js `swapZX`). The driver
     puts `swap` on #touch and Z and X trade PLACES: each keeps its label and
     its action, only the anchors change, so the letter on a button is always
     what it does. Two ids plus a class outranks the plain #btnZ / #btnX
     rules whatever their order — which is also why the landscape block
     below carries its own swapped pair (its plain #btnZ would otherwise
     lose to THESE and a swapped button would drop back to the bottom band).
     knight-sim mirrors this block by hand into thedevice's host page and
     into THIS file: vendoring never copies it. */
  #touch.swap #btnZ {
    right: calc(max(20px, env(safe-area-inset-right)) + 74px);
    bottom: max(18px, env(safe-area-inset-bottom));
  }
  #touch.swap #btnX {
    right: max(20px, env(safe-area-inset-right));
    bottom: calc(max(18px, env(safe-area-inset-bottom)) + 74px);
  }
  #touch #btnR {
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    font-size: 15px;
    line-height: 40px;
  }
  /* SIDEWAYS. In portrait the letterbox is above and below the frame, so the
     controls live in the black band underneath. In landscape the frame fills
     the HEIGHT and the black bands move to the SIDES — the bottom corners
     would sit on the game's own menu band (the 640x480 frame's bottom strip
     is the button row and HP readout). So the pad and buttons move into the
     side bars, vertically a little below centre, which is where thumbs
     naturally rest on a held-sideways phone. R keeps its top-right corner.
     Same sizes, same tolerances — only the anchors change. */
  @media (pointer: coarse) and (orientation: landscape) {
    #dpad {
      left: max(12px, env(safe-area-inset-left));
      bottom: auto;
      top: 55%;
      transform: translateY(-50%);
    }
    #btnZ {
      right: max(16px, env(safe-area-inset-right));
      bottom: auto;
      top: calc(55% - 58px);
      transform: translateY(-50%);
    }
    #btnX {
      right: calc(max(16px, env(safe-area-inset-right)) + 40px);
      bottom: auto;
      top: calc(55% + 30px);
      transform: translateY(-50%);
    }
    /* The swap, sideways — the FULL anchor set (bottom: auto included),
       because the portrait swap rules outrank these plain ones. */
    #touch.swap #btnZ {
      right: calc(max(16px, env(safe-area-inset-right)) + 40px);
      bottom: auto;
      top: calc(55% + 30px);
      transform: translateY(-50%);
    }
    #touch.swap #btnX {
      right: max(16px, env(safe-area-inset-right));
      bottom: auto;
      top: calc(55% - 58px);
      transform: translateY(-50%);
    }
  }
  /* THE PRE-FIGHT MODE SELECT. Deliberately plain: it is a stand-in for the
     game's own pixel choicer and must not be mistaken for it. `[hidden]`
     needs the explicit rule because `#modeselect` sets `display: flex`. */
  #modeselect {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
    z-index: 10;
  }
  #modeselect[hidden] { display: none; }
  #modeselect-box {
    border: 2px solid #fff;
    background: #000;
    padding: 18px 22px;
    max-width: min(90vw, 420px);
    text-align: center;
  }
  #modeselect-msg { margin: 0 0 12px; color: #fff; }
  #modeselect-msg:empty { display: none; }
  #modeselect-rows { display: flex; flex-direction: column; gap: 8px; }
  #modeselect-rows button {
    font: inherit;
    color: #fff;
    background: #000;
    border: 1px solid #fff;
    padding: 8px 14px;
    cursor: pointer;
  }
  #modeselect-rows button:hover,
  #modeselect-rows button:focus-visible { background: #fff; color: #000; }
</style>
</head>
<body>
  <canvas id="game" width="640" height="480"></canvas>
  <div id="touch">
    <div id="dpad" class="pad"></div>
    <div id="btnZ" class="btn">Z</div>
    <div id="btnX" class="btn">X</div>
    <div id="btnR" class="btn">R</div>
  </div>
  <!-- THE PRE-FIGHT MODE SELECT (ledger G-6). Hidden unless the practice
       setting is on (`?prac=1`), which is the mod's own default: with it off
       `obj_ch3_PTB02` forces Standard and never raises the menu.

       A LABELLED STAND-IN, and the label is not decoration. The mod draws
       this with `obj_choicer_neo`, a pixel menu; these are DOM buttons. The
       four STRINGS, their ORDER and what each one DOES are EnderCat8's and
       are pinned by kaizo/tools/checks/check-prefight-modeselect.mjs; the
       pixels are ours, and the repo's fourth law says nothing invented ships
       unlabelled. -->
  <div id="modeselect" hidden>
    <div id="modeselect-box">
      <p id="modeselect-msg"></p>
      <div id="modeselect-rows"></div>
    </div>
  </div>
  <script type="module" src="./kaizo.js"></script>
</body>
</html>
